name: CI

on: 
    push:

jobs:
    tests:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: ask_your_data_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg-isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        env:
            PYTHONPATH: ${{ github.workspace }}
            POSTGRES_HOST: localhost
            POSTGRES_PORT: 5432
            POSTGRES_DB: ask_your_data_test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres

        steps:
            - name: Retriew code
              uses: actions/checkout@v6
            
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                python-version: "3.12"
            
            - name: Install dependencies
              run: uv sync --locked
            
            - name: Launch tests                
              run: uv run pytest -v