services:
  # Streamlit application
  streamlit:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - postgres
  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: ask-your-data-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # Volume for PostgreSQL data persistence
volumes:
  postgres_data: